<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide-flat.min.css" />
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
	<script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
	<style>
		table[tablename="dependentes"] .wdk-control,
		table[tablename="dependentes"] th.wdk-control {
			display: none !important;
		}
	</style>

</head>

<body>
	<div class="fluig-style-guide">
		<form class="form" role="form" id="formCadastro">
			<input type="hidden" name="atividadeAtual" id="atividadeAtual">

			<div class="text-center">
				<h1><strong>Solicitação de Admissão</strong></h1>
				<h1><strong>Fluig Teste</strong></h1>
			</div>

			<div class="panel panel-info" id="solicitar_inscricao" name="solicitar_inscricao">
				<div class="panel-heading">
					<h3 class="panel-title font-bold">Informações Pessoais</h3>
				</div>
				<div class="panel-body">
					<div class="row">
						<div class="col-md-4">
							<div class="form-group">
								<div class="input-group">
									<label for="observacao">
										Informe seu nome:
										<span class="text-danger">*</span>
									</label>
									<input type="text" name="nome" id="nome" class="form-control"
										placeholder="Nome completo">
								</div>
							</div>
						</div>

						<div class="col-md-4">
							<div class="form-group">
								<div class="input-group">
									<label for="email">
										Informe seu email:
										<span class="text-danger">*</span>
									</label>
									<input type="email" name="email" id="email" class="form-control"
										placeholder="E-mail">
								</div>
							</div>
						</div>

						<div class="col-md-4">
							<div class="form-group">
								<div class="input-group">
									<label for="idade">
										Informe sua idade:
										<span class="text-danger">*</span>
									</label>
									<input type="text" name="idade" id="idade" class="form-control" placeholder="Idade">
								</div>
							</div>
						</div>

						<div class="col-md-4">
							<div class="form-group">
								<label for="">
									Estado Civil:
									<span class="text-danger">*</span>
								</label>
								<div class="custom-radio custom-radio-primary">
									<input type="radio" name="estadoCivil" value="solteiro" id="radio-1">
									<label for="radio-1">Solteiro</label>
								</div>
								<div class="custom-radio custom-radio-success">
									<input type="radio" name="estadoCivil" value="casado" id="radio-2">
									<label for="radio-2">Casado</label>
								</div>
								<div class="custom-radio custom-radio-info">
									<input type="radio" name="estadoCivil" value="divorciado" id="radio-3">
									<label for="radio-3">Divorciado</label>
								</div>
							</div>
						</div>
					</div>

					<hr>

					<div class="row">
						<div class="col-md-12">

							<h4 class="font-bold text-primary">
								Dependentes
							</h4>

							<div class="text-right">
								<button type="button" class="btn btn-primary btn-sm"
									onclick="wdkAddChild('dependentes')" title="Adicionar dependente">
									<i class="fluigicon fluigicon-plus"></i>
								</button>
							</div>
							<div class="table-responsive">


								<table tablename="dependentes" class="table table-striped table-bordered table-hover"
									noaddbutton="true" nodeletebutton="true">

									<thead>
										<tr>
											<th style="width:50%;">Nome do Dependente</th>
											<th style="width:25%;">Idade</th>
											<th style="width:10%;" class="text-center">Ações</th>
										</tr>
									</thead>

									<tbody>
										<tr>
											<td>
												<input type="text" name="nomeDependente" class="form-control"
													placeholder="Nome completo">
											</td>

											<td>
												<input type="number" name="idadeDependente" class="form-control"
													placeholder="Idade" min="0">
											</td>

											<td class="text-center">
												<button type="button" class="btn btn-danger btn-sm"
													onclick="fnWdkRemoveChild(this)" title="Remover dependente">
													<i class="fluigicon fluigicon-trash"></i>
												</button>
											</td>

										</tr>
									</tbody>

								</table>

							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="panel panel-info" id="validacao_rh" name="validacao_rh">
				<div class="panel-heading">
					<h3 class="panel-title font-bold">Validação RH</h3>
				</div>
				<div class="panel-body">
					<div class="row">
						<div class="form-group">
							<label>Dependentes cadastrados:</label>
							<div id="listaDependentes"></div>
						</div>

						<div class="col-md-4">
							<div class="form-group">
								<label for="">
									Dados estão corretos?:
									<span class="text-danger">*</span>
								</label>
								<div class="custom-radio custom-radio-primary">
									<input type="radio" name="dadosCorretos" value="sim" id="dadosCorretos-1">
									<label for="dadosCorretos-1">Sim</label>
								</div>
								<div class="custom-radio custom-radio-primary">
									<input type="radio" name="dadosCorretos" value="nao" id="dadosCorretos-2">
									<label for="dadosCorretos-2">Não</label>
								</div>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<div class="input-group">
									<label for="observacao">Observação:</label>
									<textarea class="form-control" name="observacao" id="observacao"
										rows="3"></textarea>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="panel panel-info" id="finalizar_inscricao" name="finalizar_inscricao">
				<div class="panel-heading">
					<h3 class="panel-title font-bold">Finalizar Inscrição</h3>
				</div>
				<div class="panel-body">
					<div class="row">
						<div class="col-md-4">
							<div class="form-group">
								<div class="input-group">
									<label for="matricula">
										Informe o número de matrícula:
										<span class="text-danger">*</span>
									</label>
									<input type="text" name="matricula" id="matricula" class="form-control"
										placeholder="Número de matrícula">
								</div>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<div class="input-group">
									<label for="empresa">
										Informe o nome da empresa:
										<span class="text-danger">*</span>
									</label>
									<input type="zoom" id="empresa" name="empresa" data-zoom="{
											'datasetId':'ds_empresas',
											'displayKey':'nome',
											'fields':[
												{'field':'codigo','label':'Código'},
												{'field':'nome','label':'Empresa'}
											]
										}">
								</div>
							</div>
						</div>
						<div class="col-md-4">
							<div class="form-group">
								<div class="input-group">
									<label for="setor">
										Informe o setor de alocação:
										<span class="text-danger">*</span>
									</label>
									<input type="text" name="setor" id="setor" class="form-control"
										placeholder="Setor de alocação">
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="text-right">
				<button type="submit" class="btn btn-success">Enviar</button>
			</div>
		</form>
	</div>

	</div>
	<script type="text/javascript" src="./script.js"></script>
</body>

</html>
